name: Enable all KIMSE locales once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-kimse-locales-once.yml'

permissions:
  contents: read

jobs:
  enable:
    runs-on: [self-hosted, linux, x64, suaveforge-deploy, server123]
    timeout-minutes: 10
    steps:
      - name: Enable every LocalizeHub widget locale for KIMSE p45
        shell: bash
        run: |
          set -Eeuo pipefail
          DOCKER=/home/ggul-docker/bin/docker
          HOST=unix:///home/ggul-docker/run/docker.sock
          test -x "$DOCKER"
          test -S /home/ggul-docker/run/docker.sock
          "$DOCKER" -H "$HOST" exec localizehub-db psql -U localizehub -d localizehub -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $$
          DECLARE pid uuid;
          BEGIN
            SELECT id INTO pid FROM localizehub.projects WHERE monitor_project_id='p45' LIMIT 1;
            IF pid IS NULL THEN RAISE EXCEPTION 'KIMSE p45 not found'; END IF;
            DELETE FROM localizehub.project_locales WHERE project_id=pid;
            INSERT INTO localizehub.project_locales(project_id,locale,enabled,date_format,time_format,time_zone,currency_code,currency_display) VALUES
              (pid,'ko',true,'YYYY-MM-DD','HH:mm','Asia/Seoul','KRW','symbol'),
              (pid,'en',true,'MM/DD/YYYY','h:mm a','UTC','USD','symbol'),
              (pid,'ja',true,'YYYY/MM/DD','HH:mm','Asia/Tokyo','JPY','symbol'),
              (pid,'vi',true,'DD/MM/YYYY','HH:mm','Asia/Ho_Chi_Minh','VND','symbol'),
              (pid,'id',true,'DD/MM/YYYY','HH:mm','Asia/Jakarta','IDR','symbol'),
              (pid,'es',true,'DD/MM/YYYY','HH:mm','Europe/Madrid','EUR','symbol'),
              (pid,'zh',true,'YYYY-MM-DD','HH:mm','Asia/Shanghai','CNY','symbol'),
              (pid,'fr',true,'DD/MM/YYYY','HH:mm','Europe/Paris','EUR','symbol'),
              (pid,'de',true,'DD.MM.YYYY','HH:mm','Europe/Berlin','EUR','symbol'),
              (pid,'ru',true,'DD.MM.YYYY','HH:mm','Europe/Moscow','RUB','symbol');
            UPDATE localizehub.projects SET default_locale='ko', updated_at=now() WHERE id=pid;
          END $$;
          COMMIT;
          SQL

          url='https://api-localizehub.suaveforge.com:18025/api/v1/public/projects/p45/locales'
          curl -fsS --max-time 20 "$url" -o /tmp/kimse-locales.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/kimse-locales.json','utf8'));
          const want=['ko','en','ja','vi','id','es','zh','fr','de','ru'];
          const got=[...(x.supportedLocales||[])].sort();
          const expected=[...want].sort();
          if(JSON.stringify(got)!==JSON.stringify(expected))throw new Error('supportedLocales mismatch: '+JSON.stringify(got));
          if(x.defaultLocale!=='ko')throw new Error('default locale is not ko');
          console.log('KIMSE_ALL_LOCALES_PASS='+got.join(','));
          NODE
